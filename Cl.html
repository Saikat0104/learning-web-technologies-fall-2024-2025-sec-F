<!DOCTYPE html>
<html>
<head>
  <title>Calculator</title>
</head>
<body>
  <h2>Calculator</h2>

  <input id="num1" type="number" placeholder="Number 1">
  <button onclick="clearField('num1')">C</button>
  <br><br>

  <input id="num2" type="number" placeholder="Number 2">
  <button onclick="clearField('num2')">C</button>
  <br><br>

  <button onclick="calculate('+')">+</button>
  <button onclick="calculate('-')">-</button>
  <button onclick="calculate('*')">*</button>
  <button onclick="calculate('/')">/</button>
  <br><br>

  <input id="result" type="text" placeholder="Result" readonly>
  <button onclick="clearField('result')">C</button>
  <br><br>

  <button onclick="clearAll()">AC</button>

  <script>
    function calculate(op) {
      let n1 = parseFloat(document.getElementById("num1").value);
      let n2 = parseFloat(document.getElementById("num2").value);
      let result;

      if (isNaN(n1) || isNaN(n2)) {
        result = "Enter both numbers!";
      } else {
        switch(op) {
          case '+': result = n1 + n2; break;
          case '-': result = n1 - n2; break;
          case '*': result = n1 * n2; break;
          case '/': result = (n2 !== 0) ? (n1 / n2) : "Error: Divide by 0"; break;
        }
      }
      document.getElementById("result").value = result;
    }

    function clearField(fieldId) {
      document.getElementById(fieldId).value = "";
    }

    function clearAll() {
      document.getElementById("num1").value = "";
      document.getElementById("num2").value = "";
      document.getElementById("result").value = "";
    }
  </script>
</body>
</html>
